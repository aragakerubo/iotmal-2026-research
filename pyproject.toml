[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "iotmal"
version = "0.1.0"
description = "Cross-architecture IoT malware detection on CIC-YNU-IoTMal 2026"
readme = "README.md"
requires-python = ">=3.12"
# Runtime dependencies: everything a job or a notebook needs to read the
# parquet files and train the baselines. AWS-only packages live in the
# optional "aws" group so local test runs stay light.
dependencies = [
    "polars>=1.0",
    "pyarrow>=15",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Needed only where jobs are launched. S3 reads go through pyarrow.fs, which
# needs neither boto3 nor s3fs; s3fs is avoided because its aiobotocore pin
# conflicts with the boto3 that sagemaker wants.
aws = ["boto3>=1.34", "sagemaker>=2.200"]
# Needed only to run `make check`.
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts", "jobs"]
# The authors' own reader is kept verbatim as a reference, not as our code.
exclude = ["docs/supplementary"]

[tool.ruff.lint]
# E/F: pyflakes and pycodestyle; I: import order; D: docstrings, because
# every module and public function in this repo carries one.
select = ["E", "F", "I", "D"]
ignore = ["D203", "D213"]  # one-blank-line-before-class and multi-line-summary-second-line conflict with their pairs

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]  # test names are the documentation

[tool.coverage.run]
source = ["src/iotmal"]
